# Full stack: MongoDB + indexer + verification worker + web server.
#   cp .env.example .env   # set ETHEREUM_RPC_URL (and START_BLOCK)
#   docker compose up -d --build
x-explorer-build: &explorer-build
  context: .
  args:
    NEXT_PUBLIC_CHAIN_NAME: ${NEXT_PUBLIC_CHAIN_NAME:-Ethereum}
    NEXT_PUBLIC_NATIVE_SYMBOL: ${NEXT_PUBLIC_NATIVE_SYMBOL:-ETH}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: *explorer-build
    command: ["node", "scripts/create-indexes.js"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/explorer
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  indexer:
    build: *explorer-build
    command: ["node", "scripts/sync.js"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/explorer
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true

  web:
    build: *explorer-build
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/explorer
    ports:
      - "3000:3000"
    volumes:
      - solc-cache:/app/.solc-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  verifier:
    build: *explorer-build
    command: ["node", "scripts/verify-worker.js"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/explorer
    volumes:
      - solc-cache:/app/.solc-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  mongo-data:
  solc-cache:
